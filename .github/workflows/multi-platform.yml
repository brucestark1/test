name: Multi-Platform Tests

on:
  push:
    branches: [ main, master, claude/** ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y jq

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install jq

    - name: Install Python dependencies
      run: |
        pip3 install --upgrade pip
        pip3 install pyhocon

    - name: Verify dependencies
      run: |
        echo "OS: ${{ matrix.os }}"
        echo "Python: ${{ matrix.python-version }}"
        jq --version
        python3 --version
        python3 -c "import pyhocon; print(f'pyhocon installed successfully')"

    - name: Make scripts executable
      run: |
        chmod +x compare_json_configs.sh
        chmod +x tests/run_tests.sh

    - name: Run test suite
      run: |
        ./tests/run_tests.sh

    - name: Test script on sample configs
      run: |
        echo "Testing on ${{ matrix.os }} with Python ${{ matrix.python-version }}..."
        ./compare_json_configs.sh
