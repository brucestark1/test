database {
  host = "localhost"
  port = 5432
  name = "mydb"
  credentials {
    username = "admin"
    password = "secret"
  }
}

server {
  host = "0.0.0.0"
  port = 8080
  timeout = 30
}

logging {
  level = "info"
  file = "/var/log/app.log"
  rotation {
    enabled = true
    maxSize = "10MB"
  }
}

features {
  authentication = true
  caching = true
}
